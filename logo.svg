<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Portal/threshold mark -->
  <rect x="60" y="20" width="80" height="110" rx="2" stroke="#9E7C3C" stroke-width="3" fill="none"/>
  <!-- Inner arch -->
  <path d="M80 130 L80 70 Q100 50 120 70 L120 130" stroke="#9E7C3C" stroke-width="2.5" fill="none"/>
  <!-- Threshold line (ground) -->
  <line x1="55" y1="130" x2="145" y2="130" stroke="#9E7C3C" stroke-width="3"/>
  <!-- Subtle center mark -->
  <circle cx="100" cy="90" r="3" fill="#9E7C3C"/>
  <!-- Publisher name -->
  <text x="100" y="168" font-family="Georgia, serif" font-size="11" font-weight="600" letter-spacing="4" fill="#1A1824" text-anchor="middle">ÉDITIONS</text>
  <text x="100" y="188" font-family="Georgia, serif" font-size="16" font-weight="400" letter-spacing="6" fill="#9E7C3C" text-anchor="middle">LIMINALE</text>
  <line x1="60" y1="200" x2="140" y2="200" stroke="#9E7C3C" stroke-width="0.8"/>
  <text x="100" y="216" font-family="Georgia, serif" font-size="7" letter-spacing="2" fill="#7A7490" text-anchor="middle">MAISON D'ÉDITION INDÉPENDANTE</text>
</svg>
